[package]
name = "constant_time_eq"
version = "0.6.0"
edition = "2021"
authors = ["Cesar Eduardo Barros <cesarb@cesarb.eti.br>"]
description = "Compares two equal-sized byte strings in constant time."
documentation = "https://docs.rs/constant_time_eq"
#repository = "https://github.com/cesarb/constant_time_eq"
repository = "https://codeberg.org/cesarb/constant_time_eq"
readme = "README"
keywords = ["constant_time"]
categories = ["cryptography", "no-std"]
license = "CC0-1.0 OR MIT-0 OR Apache-2.0"
rust-version = "1.66.0"

[build-dependencies]
rustversion = "1.0"

[dev-dependencies]
criterion = { version = "0.8.0", features = ["cargo_bench_support", "html_reports"] }
count_instructions = "0.2.0"

[features]
default = ["std"]

# Necessary to detect at runtime whether DIT is available on aarch64.
std = []

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "bench_generic"
harness = false
